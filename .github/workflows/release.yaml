name: Release

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  build-pypi-wheels:
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build debmagic (cli)
        run: |
          uvx --directory packages/debmagic maturin build \
            --release \
            --locked \
            --manifest-path ./Cargo.toml \
            --out ../../dist \
            --compatibility pypi
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: pypi-wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  publish-pypi:
    needs: build-pypi-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: pypi-wheel-*
          path: dist
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  publish-crates-io:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: crates-io-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p debmagic-common --locked
          cargo publish -p debmagic --locked
