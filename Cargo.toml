[workspace]
resolver = "3"
members = ["packages/debmagic", "packages/debmagic-common"]

[workspace.package]
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
# internal
debmagic-common = { path = "packages/debmagic-common", version = "0.0.1-alpha.8" }

# third party
clap = { version = ">=4.5.23", features = ["derive"] }
anyhow = { version = ">=1.0.95" }
config = { version = ">=0.15.9", features = ["toml"] }
dirs = ">=5.0.0"
# thiserror = "2.0.17" # for future uses when we need clearer error handling
glob = ">=0.3.2"
libc = ">=0.2.169"
serde = { version = ">=1.0.217", features = ["derive"] }
serde_json = ">=1.0.139"
tempfile = ">=3.10"
toml = ">=0.8"
toml_edit = ">=0.22"
uuid = { version = ">=1.10.0", features = ["v4", "v5"] }
chrono = { version = ">=0.4.42" }
regex = { version = ">=1.12.2" }
reqwest = { version = ">=0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
tokio = { version = ">=1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
debian-changelog = { version = ">=0.2.14" }
debian-control = { version = ">=0.3" }
deb822-lossless = { version = ">=0.5" }
ignore = { version = ">=0.4.25" }
md-5 = { version = ">=0.11" }
sha1 = { version = ">=0.11" }
sha2 = { version = ">=0.11" }
# `sqlite` bundles libsqlite3; Debian's sqlx maps it to the system library
sqlx = { version = ">=0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# dev dependencies
test-case = { version = ">=3.3.1" }
