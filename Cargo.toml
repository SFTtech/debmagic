[workspace]
resolver = "3"
members = ["packages/debmagic", "packages/debmagic-common"]

[workspace.package]
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
# internal
debmagic-common = { path = "packages/debmagic-common", version = "0.0.1-alpha.8" }

# third party
clap = { version = ">=4.5.23", features = ["derive"] }
anyhow = { version = ">=1.0.95" }
config = { version = ">=0.15.9", features = ["toml"] }
dirs = ">=5.0.0"
# thiserror = "2.0.17" # for future uses when we need clearer error handling
glob = ">=0.3.2"
globset = ">=0.4.16"
libc = ">=0.2.169"
serde = { version = ">=1.0.217", features = ["derive"] }
serde_json = ">=1.0.139"
toml = ">=0.8"
toml_edit = ">=0.22"
uuid = { version = ">=1.10.0", features = ["v4", "v5"] }
chrono = { version = ">=0.4.42" }
regex = { version = ">=1.12.2" }
debian-changelog = { version = ">=0.2.14" }
debian-control = { version = ">=0.1.39" }
deb822-lossless = { version = ">=0.2" }
ignore = { version = ">=0.4.25" }
md-5 = { version = ">=0.11" }
sha1 = { version = ">=0.11" }
sha2 = { version = ">=0.11" }
ar = { version = ">=0.9.0" }
tar = { version = ">=0.4.45" }
flate2 = { version = ">=1.1.9" }
xz2 = { version = ">=0.1.7" }
zstd = { version = ">=0.13.3" }
goblin = { version = ">=0.10.7" }

# dev dependencies
test-case = { version = ">=3.3.1" }
tempfile = { version = ">=3.27.0" }
insta = { version = ">=1.48.0" }
