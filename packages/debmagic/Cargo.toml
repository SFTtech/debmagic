[package]
name = "debmagic"
version = "0.0.1-alpha.8"
description = "modern tooling for building and packaging Debian/Ubuntu packages in isolated environments"
license = "GPL-2.0-or-later"
readme = "README.md"
documentation = "https://debmagic.readthedocs.org"
homepage = "https://github.com/SFTtech/debmagic"
repository = "https://github.com/SFTtech/debmagic.git"
rust-version.workspace = true
edition.workspace = true

[dependencies]
debmagic-common = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
config = { workspace = true, features = ["toml"] }
dirs = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
debian-changelog = { workspace = true }
debian-control = { workspace = true }
deb822-lossless = { workspace = true }
ignore = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = { workspace = true }
