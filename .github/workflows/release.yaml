name: Release

on:
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build debmagic (cli)
        # Outside the uv workspace (keeps `uv sync` in CI fast); build by path into dist/.
        run: uv build packages/debmagic --out-dir dist
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
